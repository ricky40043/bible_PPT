<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>密碼協助 · __APP_NAME__</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Microsoft JhengHei",sans-serif;background:#0c1424;color:#e2e8f0;line-height:1.6}main{max-width:480px;margin:7vh auto;padding:24px}section{background:#19253b;border:1px solid #334155;border-radius:18px;padding:24px;margin:18px 0}h1{font-size:1.4rem}h2{font-size:1.1rem}label{display:block;margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid #64748b;border-radius:8px;background:#0c1424;color:inherit;font:inherit}button{padding:12px 16px;border:0;border-radius:8px;background:#6366f1;color:white;cursor:pointer;font:inherit;margin-top:16px}button:disabled{opacity:.5;cursor:wait}a{color:#a5b4fc}.muted{color:#94a3b8;font-size:.9rem}#message{white-space:pre-wrap;overflow-wrap:anywhere}details summary{cursor:pointer}nav{display:flex;gap:20px;flex-wrap:wrap}[hidden]{display:none!important}
</style></head><body><main><h1>__APP_NAME__ · 密碼協助</h1><p class="muted">透過綁定的信箱重設密碼，或使用目前密碼變更密碼。</p><nav><a href="#forgot" id="forgotTab">忘記密碼</a><a href="#change" id="changeTab">修改密碼</a></nav><p id="message" role="status" aria-live="polite"></p>
<section id="forgotPanel"><h2>忘記密碼</h2><form id="forgotForm"><label for="email">帳號綁定的電子郵件</label><input id="email" type="email" autocomplete="email" maxlength="254" required><button>寄出重設密碼連結</button></form><p class="muted">連結30分鐘內有效，使用後即失效。未綁定信箱的帳號請聯絡管理員協助確認身分。</p></section>
<section id="resetPanel" hidden><h2>設定新密碼</h2><form id="resetForm"><label for="newPassword">新密碼（至少8碼）</label><input id="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="72" required><label for="confirmPassword">再次輸入新密碼</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="72" required><button>重設密碼</button></form></section>
<section id="changePanel" hidden><h2>修改密碼</h2><form id="changeForm"><label for="changeEmail">電子郵件</label><input id="changeEmail" type="email" autocomplete="username" maxlength="254" required><label for="currentPassword">目前密碼</label><input id="currentPassword" type="password" autocomplete="current-password" required><label for="changePassword">新密碼（至少8碼）</label><input id="changePassword" type="password" autocomplete="new-password" minlength="8" maxlength="72" required><label for="changeConfirm">再次輸入新密碼</label><input id="changeConfirm" type="password" autocomplete="new-password" minlength="8" maxlength="72" required><button>修改密碼</button></form></section>
<p><a href="/">返回網站</a> · <a href="javascript:history.back()">返回上一頁</a></p></main><script>
'use strict';const prefix=__API_PREFIX__;const $=id=>document.getElementById(id);let resetToken=new URLSearchParams(location.search).get('token')||new URLSearchParams(location.hash.slice(1)).get('token')||'';
if(resetToken){history.replaceState(null,'',location.pathname+'#reset');$('forgotPanel').hidden=true;$('resetPanel').hidden=false;}
function view(name){for(const p of ['forgot','change','reset'])$(p+'Panel').hidden=p!==name;$('message').textContent='';}
$('forgotTab').onclick=()=>view('forgot');$('changeTab').onclick=()=>view('change');if(!resetToken&&location.hash==='#change')view('change');
async function submit(event,path,payload){event.preventDefault();const button=event.submitter;button.disabled=true;$('message').textContent='處理中…';try{const response=await fetch(prefix+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),cache:'no-store'});const body=await response.json();if(!response.ok){let detail=body.detail||body.error||'操作失敗';if(Array.isArray(detail))detail=detail.map(e=>e.msg).join('；');throw Error(detail);}$('message').textContent=body.message;if(path!=='/forgot-password'){resetToken='';event.target.reset();}}catch(e){$('message').textContent=e.message;}finally{button.disabled=false;}}
$('forgotForm').onsubmit=event=>submit(event,'/forgot-password',{email:$('email').value.trim()});
$('resetForm').onsubmit=event=>{if($('newPassword').value!==$('confirmPassword').value){event.preventDefault();$('message').textContent='兩次輸入的新密碼不一致';return;}if(!resetToken){event.preventDefault();$('message').textContent='請先從郵件開啟有效的重設連結';return;}submit(event,'/reset-password',{token:resetToken,new_password:$('newPassword').value});};
$('changeForm').onsubmit=event=>{if($('changePassword').value!==$('changeConfirm').value){event.preventDefault();$('message').textContent='兩次輸入的新密碼不一致';return;}submit(event,'/change-password',{email:$('changeEmail').value.trim(),current_password:$('currentPassword').value,new_password:$('changePassword').value});};
</script></body></html>
